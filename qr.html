<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>駅に貼るQRコード</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css?v=19">
</head>
<body>
  <main class="qr-page">
    <section class="block">
      <h1 class="h-page">駅に貼るQRコード</h1>
      <p class="sub no-print">下北沢駅に貼る、サイトのトップを開くQRコードです。このページを印刷して使ってください。</p>
      <ul class="qr-list" id="list"></ul>
    </section>
  </main>
  <script src="vendor/qrcode.js"></script>
  <script>
    (function () {
      var url = location.href.replace(/qr\.html.*$/, "");
      var qr = qrcode(0, "M");
      qr.addData(url);
      qr.make();
      document.getElementById("list").innerHTML = '<li class="qr-item"><h2>Shimokita Backstreets</h2>' +
        qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }) +
        "<p>" + url.replace(/&/g, "&amp;") + "</p></li>";
    })();
  </script>
</body>
</html>
